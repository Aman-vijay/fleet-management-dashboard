x-robot-base: &robot-base
  build:
    context: .
    dockerfile: ./robot-simulator/Dockerfile
  depends_on:
    mosquitto:
      condition: service_healthy
    backend:
      condition: service_started

x-robot-env: &robot-env
  MQTT_URL: mqtt://mosquitto:1883
  REPLAY_SPEED: ${REPLAY_SPEED:-1}

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 2s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      PORT: "3000"
      MQTT_URL: mqtt://mosquitto:1883
    depends_on:
      mosquitto:
        condition: service_healthy

  robot-r1:
    <<: *robot-base
    environment:
      <<: *robot-env
      ROBOT_ID: r1

  robot-r2:
    <<: *robot-base
    environment:
      <<: *robot-env
      ROBOT_ID: r2

  robot-r3:
    <<: *robot-base
    environment:
      <<: *robot-env
      ROBOT_ID: r3

  robot-r4:
    <<: *robot-base
    environment:
      <<: *robot-env
      ROBOT_ID: r4

  robot-r5:
    <<: *robot-base
    environment:
      <<: *robot-env
      ROBOT_ID: r5

  robot-r6:
    <<: *robot-base
    environment:
      <<: *robot-env
      ROBOT_ID: r6

  robot-r7:
    <<: *robot-base
    environment:
      <<: *robot-env
      ROBOT_ID: r7

  robot-r8:
    <<: *robot-base
    environment:
      <<: *robot-env
      ROBOT_ID: r8
